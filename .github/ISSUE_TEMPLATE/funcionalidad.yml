name: Proponer una funcionalidad
description: Algo que te gustaría poder hacer con arcli.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Si es una pregunta o una idea todavía sin forma, abrí una [discusión](https://github.com/LcsGrz/arcli/discussions). Si ya la programaste, no hace falta este issue: abrí el PR directo y contá ahí qué problema resuelve.

        Los comandos, flags, claves de config y el `--json` son contrato público: si tu propuesta los cambia, contalo acá.
  - type: textarea
    id: objetivo
    attributes:
      label: Qué querés hacer
      description: El problema, no la solución. Por ejemplo, "facturo lo mismo todos los meses a diez clientes".
    validations:
      required: true
  - type: textarea
    id: hoy
    attributes:
      label: Cómo lo resolvés hoy
      description: Con arcli, con otro sistema o a mano en la web de ARCA.
  - type: textarea
    id: propuesta
    attributes:
      label: Cómo te imaginás que funcione
      description: Opcional. Un comando de ejemplo ayuda mucho.
      render: shell
  - type: dropdown
    id: implementar
    attributes:
      label: ¿Te gustaría implementarla?
      options:
        - Sí, quiero hacer el PR
        - Puedo ayudar a probarla
        - No, solo la propongo
  - type: input
    id: comprobantes
    attributes:
      label: Comprobantes afectados
      description: Por ejemplo, Factura C, Notas de crédito A, FCE, exportación E.
