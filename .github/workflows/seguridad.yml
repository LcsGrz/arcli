# Análisis de seguridad: CodeQL sobre el código y revisión de las dependencias que agrega cada PR.
# Secret scanning con push protection está activado en la configuración del repo (no es un workflow).
name: Seguridad

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  schedule:
    # Los lunes: CodeQL suma consultas nuevas aunque el código no cambie.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analizar
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

  # Falla si el PR agrega una dependencia con una vulnerabilidad conocida de severidad alta o una licencia que no
  # se puede redistribuir con la del proyecto.
  dependencias:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Revisar dependencias nuevas
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0-only, GPL-3.0-only, AGPL-3.0-only
          # node-forge es "(BSD-3-Clause OR GPL-2.0)": se usa bajo BSD. La regla no entiende el OR. Autorizado el 27/11; reemplazarlo: ARQ-14.
          allow-dependencies-licenses: pkg:npm/node-forge
