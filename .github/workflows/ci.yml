name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # 22 es el minimo de "engines"; 24 es el que usa el release; 26 es la ultima.
        os: [ubuntu-latest]
        node-version: [22, 24, 26]
        # Windows y macOS solo con la version del release: alcanza para el codigo propio de cada SO (portapapeles,
        # navegador del PDF, spawn con shell, permisos de archivos).
        include:
          - os: windows-latest
            node-version: 24
          - os: macos-latest
            node-version: 24

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      # Node 25 en adelante ya no trae corepack; ahi se usa el Yarn 1 que viene en los runners.
      - name: Enable Corepack
        if: matrix.node-version < 25
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Los scripts de lint usan comillas simples en los globs, que cmd.exe no saca: el lint es igual en todos los SO.
      - name: Lint
        if: runner.os == 'Linux'
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Test with coverage
        run: yarn test:coverage

      - name: Build
        run: yarn build

  # La proteccion de main exige un check llamado "validate": este job lo da cuando pasa toda la matriz.
  validate:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Toda la matriz paso
        run: echo "ok"
